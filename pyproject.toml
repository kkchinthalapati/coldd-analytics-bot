[tool.ruff]
line-length = 160
target-version = "py310"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E702", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["tests/", ".venv/"]

[[tool.mypy.overrides]]
# Slash-command handlers use the idiomatic `return await interaction.response...` early exit.
module = "coldd.bot"
disable_error_code = ["return-value"]
